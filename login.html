<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión | EFUSA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%2216a34a%22>⚽</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
    .anim-float { animation: float 6s ease-in-out infinite; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .anim-fade { animation: fadeIn 0.6s ease-out forwards; }
    .anim-fade-delay { animation: fadeIn 0.6s ease-out 0.2s forwards; opacity: 0; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-brand-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-[420px] space-y-8 anim-fade">
    <div class="text-center">
      <div class="w-20 h-20 bg-gradient-to-br from-brand-500 to-emerald-700 rounded-3xl flex items-center justify-center mx-auto shadow-2xl shadow-brand-500/30 anim-float">
        <i class="ph ph-soccer-ball text-4xl text-white"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 mt-6">EFUSA</h1>
      <p class="text-slate-500 mt-2">Ingresa a tu panel de gestión</p>
    </div>
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 p-8 anim-fade-delay">
      <form id="login-form" class="space-y-5">
        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Usuario</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-500 transition-colors">
              <i class="ph ph-user text-lg"></i>
            </div>
            <input id="username" type="text" required autocomplete="username" class="block w-full rounded-xl border-slate-200 bg-slate-50 pl-11 pr-4 py-3.5 text-sm text-slate-900 ring-1 ring-inset ring-slate-200 focus:bg-white focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all">
          </div>
        </div>
        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Contraseña</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-500 transition-colors">
              <i class="ph ph-lock text-lg"></i>
            </div>
            <input id="password" type="password" required autocomplete="current-password" class="block w-full rounded-xl border-slate-200 bg-slate-50 pl-11 pr-4 py-3.5 text-sm text-slate-900 ring-1 ring-inset ring-slate-200 focus:bg-white focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all">
          </div>
        </div>
        <div id="login-error" class="hidden text-sm text-rose-600 font-medium bg-rose-50 p-3 rounded-xl flex items-center gap-2">
          <i class="ph ph-warning-circle text-lg"></i>
          <span id="login-error-msg">Credenciales inválidas</span>
        </div>
        <button type="submit" id="btn-login" class="w-full flex items-center justify-center gap-2 rounded-xl bg-brand-600 px-3 py-3.5 text-sm font-bold text-white shadow-lg shadow-brand-500/25 hover:bg-brand-700 hover:shadow-brand-500/40 active:scale-[0.98] transition-all">
          <i class="ph ph-sign-in text-lg"></i> Iniciar Sesión
        </button>
      </form>
    </div>
    <p class="text-center text-xs text-slate-400">Sistema de Gestión EFUSA &copy; 2024</p>
  </div>
  <script type="module">
    import { login } from './recursos/js/auth.js';
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errorDiv = document.getElementById('login-error');
      const errorMsg = document.getElementById('login-error-msg');
      btn.disabled = true;
      btn.innerHTML = '<i class="ph ph-spinner-gap text-lg animate-spin"></i> Ingresando...';
      errorDiv.classList.add('hidden');
      try {
        await login(document.getElementById('username').value, document.getElementById('password').value);
        window.location.href = '/index.html';
      } catch (err) {
        errorMsg.textContent = err.message || 'Credenciales inválidas';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i class="ph ph-sign-in text-lg"></i> Iniciar Sesión';
      }
    });
    const token = localStorage.getItem('efusa_token');
    if (token) {
      try {
        const { apiFetch } = await import('./recursos/js/configuracion.js');
        await apiFetch('/auth');
        window.location.href = '/index.html';
      } catch {}
    }
  </script>
</body>
</html>
