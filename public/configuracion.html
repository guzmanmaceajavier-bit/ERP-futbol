<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><title>Configuracion | EFUSA V7</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{600:'#16a34a'}}}}}</script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#F1F5F9}</style>
</head><body class="min-h-screen">
<div id="nav-container"></div>
<div class="bg-[#0F172A] text-white">
  <div class="max-w-7xl mx-auto px-4 md:px-6 py-6">
    <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6"><div class="flex items-center gap-3">
      <a href="/index.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i class="ph ph-arrow-left"></i></a>
      <div>
        
        <h1 class="text-2xl font-black">Configuracion</h1>
        <p class="text-white/60 text-sm">Ajustes del sistema</p>
      </div></div>
      <button onclick="window.close()" class="ml-auto w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ph ph-x"></i></button>
    </div>
  </div>
</div>
<div class="max-w-7xl mx-auto px-4 md:px-6 py-6 space-y-6">
  <div class="bg-white rounded-2xl border p-6 space-y-6">
    <div>
      <h3 class="font-black flex items-center gap-2"><i class="ph ph-buildings"></i> Escuela</h3>
      <div class="grid md:grid-cols-2 gap-4 mt-3">
        <label class="text-sm font-bold">Nombre Escuela<input id="c-escuela_nombre" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"></label>
        <label class="text-sm font-bold">Telefono<input id="c-escuela_Telefono" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"></label>
      </div>
    </div>
    <div>
      <h3 class="font-black flex items-center gap-2"><i class="ph ph-money"></i> Reglas de pago</h3>
      <div class="grid md:grid-cols-3 gap-4 mt-3">
        <label class="text-sm font-bold">Dias recordatorio<input id="c-regla_dias_recordatorio" type="number" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"></label>
        <label class="text-sm font-bold">Dia mora<input id="c-regla_dia_mora" type="number" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"></label>
        <label class="text-sm font-bold">Delay WhatsApp (s)<input id="c-whatsapp_delay_segundos" type="number" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"></label>
      </div>
    </div>
    <div class="bg-slate-50 border rounded-2xl p-4">
      <h3 class="font-black">Backup / Restore</h3>
      <p class="text-xs text-slate-500">Descarga todo en JSON o sube un backup para restaurar.</p>
      <div class="flex flex-wrap gap-2 mt-3">
        <button onclick="descargarBackup()" class="px-4 py-2.5 bg-slate-900 text-white rounded-xl text-sm font-black">Descargar Backup</button>
        <label class="px-4 py-2.5 bg-white border rounded-xl text-sm font-bold cursor-pointer">Subir Backup <input type="file" id="file-restore" accept=".json" class="hidden" onchange="subirBackup(this)"></label>
        <button onclick="formatear()" class="px-4 py-2.5 bg-rose-600 text-white rounded-xl text-sm font-black">Formatear datos</button>
      </div>
    </div>
    <button onclick="guardar()" class="w-full py-3 bg-slate-900 text-white rounded-xl font-black">Guardar configuracion</button>
  </div>
  <div class="bg-white rounded-2xl border p-6">
    <h3 class="font-black">Usuarios y Roles</h3>
    <form id="formUser" class="grid md:grid-cols-4 gap-3 mt-3">
      <input id="u-username" placeholder="usuario" required class="px-4 py-3 bg-slate-50 border rounded-xl">
      <input id="u-password" type="password" placeholder="clave" required class="px-4 py-3 bg-slate-50 border rounded-xl">
      <select id="u-role" class="px-4 py-3 bg-slate-50 border rounded-xl"><option value="admin">Admin</option><option value="profe">Profe</option><option value="super_admin">Super Admin</option></select>
      <button class="py-3 bg-purple-600 text-white rounded-xl font-black">Crear</button>
    </form>
  </div>
</div>
<script type="module">
import { verificarSesion } from '/recursos/js/auth.js';
import { injectNav } from '/recursos/js/nav.js';
import { apiFetch } from '/recursos/js/configuracion.js';
const u=await verificarSesion(); if(u) injectNav('configuracion');
if(u && u.role!=='super_admin'){ document.body.innerHTML='<div class="p-12 text-center"><h2 class="font-black text-rose-600">Solo Super Admin</h2><a href="/index.html" class="underline">Volver</a></div>'; }
async function cargar(){
  const cfg=await apiFetch('/config');
  Object.entries(cfg).forEach(([k,v])=>{ const el=document.getElementById('c-'+k); if(el) el.value=v; });
}
window.guardar=async()=>{
  const payload={};
  ['escuela_nombre','escuela_Telefono','regla_dias_recordatorio','regla_dia_mora','whatsapp_delay_segundos'].forEach(k=>{ const el=document.getElementById('c-'+k); if(el) payload[k]=el.value; });
  await apiFetch('/config',{method:'PUT', body:payload});
  alert('Guardado');
}
window.descargarBackup=async()=>{
  const data=await apiFetch('/reportes?tipo=exportar-completo');
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(url);
}
window.subirBackup=async(input)=>{
  const file=input.files[0]; if(!file) return;
  const text=await file.text();
  try{ const data=JSON.parse(text); if(!confirm('Restaurar '+(data.jugadores?.length||0)+' jugadores y '+(data.pagos?.length||0)+' pagos?')) return; alert('Backup cargado (modo local: se guardara al importar).'); } catch(e){ alert('JSON invalido'); }
}
window.formatear=async()=>{
  if(!confirm('Borrar TODOS los datos locales?')) return;
  if(!confirm('Seguro? Esta accion no se puede deshacer')) return;
  localStorage.clear(); alert('Datos locales limpiados. Recarga la pagina.');
}
document.getElementById('formUser').addEventListener('submit', async e=>{
  e.preventDefault();
  const body={ username: document.getElementById('u-username').value, password: document.getElementById('u-password').value, role: document.getElementById('u-role').value };
  try{ await apiFetch('/auth?accion=register',{method:'POST', body}); alert('Usuario creado'); e.target.reset(); }catch(err){ alert(err.message); }
});
cargar();
</script></body></html>
