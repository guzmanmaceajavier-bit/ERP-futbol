<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><title>Dinero - Gastos | EFUSA V7</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{600:'#16a34a'}}}}}</script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#F1F5F9}</style>
</head><body class="min-h-screen">
<div id="nav-container"></div>
<div class="bg-[#0F172A] text-white">
  <div class="max-w-7xl mx-auto px-4 md:px-6 py-5">
    <div class="flex items-center gap-3">
      <a href="/index.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i class="ph ph-arrow-left"></i></a>
      <div>
        <h1 class="text-2xl font-black">Gastos</h1>
        <p class="text-white/60 text-sm">Controla y registra los egresos</p>
      </div>
      <button onclick="document.getElementById('modal-gasto').classList.remove('hidden');document.getElementById('modal-gasto').classList.add('flex')" class="ml-auto px-5 py-3 bg-rose-500 hover:bg-rose-400 text-white rounded-xl font-black">+ Nuevo gasto</button>
      <button onclick="window.close()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ph ph-x"></i></button>
    </div>
  </div>
</div>
<div class="max-w-7xl mx-auto px-4 md:px-6 py-6">
  <div class="bg-white rounded-2xl border overflow-hidden shadow-sm">
    <div class="px-5 py-3 bg-rose-50 border-b flex justify-between items-center"><h3 class="font-black text-sm text-rose-900 flex items-center gap-2"><i class="ph ph-trend-down"></i> Historial de gastos</h3><span class="text-xs bg-white border px-2.5 py-1 rounded-full font-bold">Resta a caja</span></div>
    <table class="w-full text-sm"><thead class="bg-slate-50 text-[11px] font-black uppercase text-slate-500"><tr><th class="px-4 py-3">Fecha</th><th class="px-4 py-3">Concepto</th><th class="px-4 py-3">Categoria</th><th class="px-4 py-3 text-right">Monto</th><th class="px-4 py-3"></th></tr></thead><tbody id="tabla-gastos" class="divide-y"></tbody></table>
    <div class="px-4 py-3 bg-slate-50 border-t flex justify-between items-center">
      <span id="info-paginacion" class="text-xs font-bold text-slate-500">0 registros</span>
      <div class="flex gap-2">
        <button id="btn-prev" onclick="cambiarPagina(-1)" class="px-4 py-2 bg-white border rounded-xl text-sm font-bold disabled:opacity-40">Anterior</button>
        <button id="btn-next" onclick="cambiarPagina(1)" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-bold disabled:opacity-40">Siguiente</button>
      </div>
    </div>
  </div>
  <div id="modal-gasto" class="fixed inset-0 z-40 hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="this.parentElement.classList.add('hidden')"></div>
    <form id="formGasto" class="relative bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
      <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center shrink-0">
        <h2 class="font-bold flex items-center gap-2"><i class="ph ph-receipt"></i> Registrar gasto</h2>
        <div class="flex items-center gap-2">
          <button type="button" onclick="document.getElementById('modal-gasto').classList.add('hidden')" class="hidden md:flex items-center gap-1 px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-full text-xs font-bold"><i class="ph ph-arrow-left"></i> Volver</button>
          <button type="button" onclick="document.getElementById('modal-gasto').classList.add('hidden')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ph ph-x text-lg"></i></button>
        </div>
      </div>
      <div class="p-6 space-y-4 overflow-y-auto">
        <h3 class="font-bold text-sm text-slate-700">Detalles del gasto</h3>
      <input id="g-concepto" placeholder="Balones, uniformes, agua..." required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl">
      <div class="grid grid-cols-2 gap-3">
        <input id="g-monto" type="number" placeholder="Monto" required class="px-4 py-3 bg-slate-50 border rounded-xl">
        <select id="g-categoria" onchange="if(this.value==='Otro') document.getElementById('g-categoria-otro').classList.remove('hidden'); else document.getElementById('g-categoria-otro').classList.add('hidden')" class="px-4 py-3 bg-slate-50 border rounded-xl"><option>General</option><option>Balones</option><option>Uniformes</option><option>Agua</option><option>Nomina</option><option>Transporte</option><option>Otro</option></select>
      </div>
      <input id="g-categoria-otro" placeholder="Escribe categoria..." class="hidden w-full px-4 py-3 bg-amber-50 border border-amber-200 rounded-xl">
      <input id="g-fecha" type="date" class="w-full px-4 py-3 bg-slate-50 border rounded-xl">
      <input id="g-descripcion" placeholder="Descripcion (opcional)" class="w-full px-4 py-3 bg-slate-50 border rounded-xl">
      </div>
      <div class="p-6 border-t bg-slate-50 flex gap-3 shrink-0">
        <button type="button" onclick="document.getElementById('modal-gasto').classList.add('hidden')" class="flex-1 py-3 bg-white border border-slate-200 rounded-xl font-bold">Cancelar</button>
        <button type="submit" class="flex-1 py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-black">Guardar y descontar de caja</button>
      </div>
    </form>
  </div>
</div>
<script type="module">
import { verificarSesion } from '/recursos/js/auth.js';
import { injectNav } from '/recursos/js/nav.js';
import { apiFetch } from '/recursos/js/configuracion.js';
const u=await verificarSesion(); if(u) injectNav('gastos');
document.getElementById('g-fecha').valueAsDate=new Date();
let lista=[], pagina=1, porPagina=10;
window.cambiarPagina=(d)=>{ pagina+=d; renderGastos(); };
async function cargar(){ lista=await apiFetch('/gastos'); renderGastos(); }
function renderGastos(){
  const total=Math.ceil(lista.length/porPagina)||1;
  if(pagina>total) pagina=total;
  if(pagina<1) pagina=1;
  const page=lista.slice((pagina-1)*porPagina, pagina*porPagina);
  const tb=document.getElementById('tabla-gastos'); tb.innerHTML='';
  let sum=0;
  page.forEach(r=>{ sum+=Number(r.monto);
    const tr=document.createElement('tr');
    tr.className='hover:bg-slate-50';
    tr.innerHTML=`<td class="px-4 py-3 text-sm">${r.fecha.slice(0,10)}</td><td class="px-4 py-3 font-bold">${r.concepto}</td><td class="px-4 py-3"><span class="bg-slate-100 px-2 py-1 rounded-full text-xs font-bold">${r.categoria||'General'}</span></td><td class="px-4 py-3 text-right font-black text-rose-600">$${Number(r.monto).toLocaleString()}</td><td class="px-4 py-3 text-right"><button onclick="eliminar(${r.id})" class="w-8 h-8 rounded-lg bg-white border hover:bg-rose-50 text-rose-600 flex items-center justify-center"><i class="ph ph-trash"></i></button></td>`;
    tb.appendChild(tr);
  });
  if(page.length) tb.innerHTML+=`<tr class="bg-slate-900 text-white font-black"><td colspan="3" class="px-4 py-3 text-right">TOTAL</td><td class="px-4 py-3 text-right">$${sum.toLocaleString()}</td><td></td></tr>`;
  document.getElementById('info-paginacion').textContent=`Mostrando ${page.length} de ${lista.length} registros`;
  document.getElementById('btn-prev').disabled=pagina<=1;
  document.getElementById('btn-next').disabled=pagina>=total;
}
window.eliminar=async(id)=>{ if(!confirm('Estas seguro de eliminar este gasto?'))return; await apiFetch('/gastos?id='+id,{method:'DELETE'}); cargar(); }
document.getElementById('formGasto').addEventListener('submit', async e=>{
  e.preventDefault();
  let cat=document.getElementById('g-categoria').value;
  if(cat==='Otro') cat=document.getElementById('g-categoria-otro').value||'Otro';
  const payload={ concepto: document.getElementById('g-concepto').value, monto: Number(document.getElementById('g-monto').value), categoria: cat, fecha: document.getElementById('g-fecha').value, descripcion: document.getElementById('g-descripcion').value };
  try{ await apiFetch('/gastos',{method:'POST', body:payload}); document.getElementById('modal-gasto').classList.add('hidden'); e.target.reset(); document.getElementById('g-fecha').valueAsDate=new Date(); cargar(); }catch(err){ alert(err.message); }
});
cargar();
</script></body></html>
