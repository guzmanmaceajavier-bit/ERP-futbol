<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Torneos | EFUSA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #F8FAFC; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen text-slate-800 antialiased">
  <div id="nav-container"></div>
  <div class="bg-[#0F172A] text-white">
    <div class="max-w-7xl mx-auto px-4 md:px-6 py-6">
      <div class="flex items-center gap-3">
        <a href="/index.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i class="ph ph-arrow-left"></i></a>
        <div>
          <h1 class="text-2xl font-black">Torneos</h1>
          <p class="text-white/60 text-sm">Organiza torneos y convocatorias</p>
        </div>
        <button onclick="abrirModalTorneo()" class="ml-auto px-5 py-3 bg-amber-500 hover:bg-amber-400 text-white rounded-xl font-black text-sm">+ Nuevo Torneo</button>
        <button onclick="window.close()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ph ph-x"></i></button>
      </div>
    </div>
  </div>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="bg-white rounded-2xl border overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 text-[11px] font-black uppercase text-slate-500"><tr><th class="px-4 py-3">Torneo</th><th class="px-4 py-3">Tipo</th><th class="px-4 py-3">Categoria</th><th class="px-4 py-3">Fecha</th><th class="px-4 py-3 text-right">Costo</th><th class="px-4 py-3 text-center">Convocados</th><th class="px-4 py-3"></th></tr></thead>
        <tbody id="tabla-torneos" class="divide-y"></tbody>
      </table>
      <div class="px-4 py-3 bg-slate-50 border-t flex justify-between items-center">
        <span id="info-paginacion" class="text-xs font-bold text-slate-500">0 registros</span>
        <div class="flex gap-2">
          <button id="btn-prev" onclick="cambiarPagina(-1)" class="px-4 py-2 bg-white border rounded-xl text-sm font-bold disabled:opacity-40">Anterior</button>
          <button id="btn-next" onclick="cambiarPagina(1)" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-bold disabled:opacity-40">Siguiente</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-torneo" class="fixed inset-0 z-40 hidden">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="document.getElementById('modal-torneo').classList.add('hidden');document.getElementById('modal-torneo').classList.remove('flex')"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto p-4 flex items-center justify-center">
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[90vh] flex flex-col">
          <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center shrink-0">
            <h3 id="modal-torneo-title" class="font-bold flex items-center gap-2"><i class="ph ph-trophy"></i> Nuevo Torneo</h3>
            <div class="flex items-center gap-2">
              <button type="button" onclick="document.getElementById('modal-torneo').classList.add('hidden');document.getElementById('modal-torneo').classList.remove('flex')" class="hidden md:flex items-center gap-1 px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-full text-xs font-bold"><i class="ph ph-arrow-left"></i> Volver</button>
              <button type="button" onclick="document.getElementById('modal-torneo').classList.add('hidden');document.getElementById('modal-torneo').classList.remove('flex')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ph ph-x text-lg"></i></button>
            </div>
          </div>
          <div class="p-6 overflow-y-auto">
          <form id="formTorneo" class="space-y-4">
            <input type="hidden" id="torneo-id">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Nombre *</label>
                <input id="torneo-nombre" required class="w-full rounded-xl border bg-slate-50 px-4 py-3 text-sm">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Tipo Genero *</label>
                <select id="torneo-tipo" class="w-full rounded-xl border bg-slate-50 px-4 py-3 text-sm"><option value="Mixto">Mixto</option><option value="Masculino">Masculino</option><option value="FemeNino">FemeNino</option></select>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">Categoria</label>
              <select id="torneo-categoria" class="w-full rounded-xl border bg-slate-50 px-4 py-3 text-sm"><option value="">Todas</option><option>Sub 17-18</option><option>Sub 16-15</option><option>Sub 14-13</option><option>Sub 12-11</option><option>Sub 10-9</option><option>Sub 8-7</option></select>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Fecha Inicio</label>
                <input id="torneo-fecha-inicio" type="date" class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Fecha Fin</label>
                <input id="torneo-fecha-fin" type="date" class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">Lugar</label>
              <input id="torneo-lugar" class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">Costo</label>
              <input id="torneo-costo" type="number" class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">Observacion</label>
              <textarea id="torneo-observacion" rows="2" class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
            </div>
            <div class="flex gap-3 pt-4">
              <button type="button" onclick="document.getElementById('modal-torneo').classList.add('hidden');document.getElementById('modal-torneo').classList.remove('flex')" class="flex-1 py-3 bg-white border border-slate-200 rounded-xl font-bold">Cancelar</button>
              <button type="submit" class="flex-1 py-3 bg-amber-600 text-white font-bold rounded-xl hover:bg-amber-700">Guardar Torneo</button>
            </div>
          </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { verificarSesion } from '/recursos/js/auth.js';
    import { injectNav } from '/recursos/js/nav.js';
    import { apiFetch } from '/recursos/js/configuracion.js';
    const usuario = await verificarSesion();
    if (usuario) {
      injectNav('torneos');
      const tabla = document.getElementById('tabla-torneos');
      let lista=[], pagina=1, porPagina=10;
      window.cambiarPagina=(d)=>{ pagina+=d; renderTorneos(); };

      async function cargarTorneos() {
        try {
          lista = await apiFetch('/torneos');
          renderTorneos();
        } catch (e) { console.error(e); }
      }

      function renderTorneos(){
        const total=Math.ceil(lista.length/porPagina)||1;
        if(pagina>total) pagina=total;
        if(pagina<1) pagina=1;
        const page=lista.slice((pagina-1)*porPagina, pagina*porPagina);
        tabla.innerHTML = '';
        if (page.length === 0) {
          tabla.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-slate-400">No hay torneos registrados.</td></tr>';
        } else {
          page.forEach(t => {
            const tipoBadge = t.tipo_genero==='FemeNino' ? 'bg-pink-100 text-pink-700 border-pink-200' : t.tipo_genero==='Masculino' ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-slate-100 text-slate-600 border-slate-200';
            tabla.innerHTML += `
              <tr class="hover:bg-slate-50 transition">
                <td class="px-4 py-3 font-bold text-slate-900">${t.nombre}</td>
                <td class="px-4 py-3"><span class="text-xs px-2 py-1 rounded-full font-bold border ${tipoBadge}">${t.tipo_genero||'Mixto'}</span></td>
                <td class="px-4 py-3 text-xs">${t.categoria_requerida||'-'}</td>
                <td class="px-4 py-3 text-xs">${t.fecha_inicio ? t.fecha_inicio.split('T')[0] : '-'} - ${t.fecha_fin ? t.fecha_fin.split('T')[0] : '-'}</td>
                <td class="px-4 py-3 text-right font-bold">$${Number(t.costo).toLocaleString()}</td>
                <td class="px-4 py-3 text-center"><span class="bg-amber-100 text-amber-700 px-2 py-1 rounded-full text-xs font-bold">${t.convocados || 0}</span></td>
                <td class="px-4 py-3 text-center"><button onclick="verConvocados(${t.id}, '${t.tipo_genero||'Mixto'}')" class="text-xs bg-slate-900 text-white px-3 py-1.5 rounded-full font-bold">Ver</button></td>
              </tr>
            `;
          });
        }
        document.getElementById('info-paginacion').textContent=`Mostrando ${page.length} de ${lista.length} registros`;
        document.getElementById('btn-prev').disabled=pagina<=1;
        document.getElementById('btn-next').disabled=pagina>=total;
      }
      cargarTorneos();

      window.abrirModalTorneo = function() {
        document.getElementById('modal-torneo').classList.remove('hidden');
        document.getElementById('modal-torneo').classList.add('flex');
        document.getElementById('formTorneo').reset();
        document.getElementById('torneo-id').value = '';
        document.getElementById('modal-torneo-title').innerText = 'Nuevo Torneo';
      };

      window.verConvocados = async (id, tipo)=>{
        const jugadores=await apiFetch('/jugadores');
        let filtrados=jugadores;
        if(tipo==='FemeNino') filtrados=jugadores.filter(j=> j.genero==='FemeNino');
        else if(tipo==='Masculino') filtrados=jugadores.filter(j=> j.genero==='Masculino');
        alert('Torneo '+tipo+': '+filtrados.length+' jugadores elegibles (filtrado por genero real). En esta demo se muestra el conteo. Para inscribir, el sistema solo deja elegir '+tipo+'.');
      };
      document.getElementById('formTorneo').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('torneo-id').value;
        const payload = {
          nombre: document.getElementById('torneo-nombre').value,
          tipo_genero: document.getElementById('torneo-tipo').value,
          categoria_requerida: document.getElementById('torneo-categoria').value,
          fecha_inicio: document.getElementById('torneo-fecha-inicio').value,
          fecha_fin: document.getElementById('torneo-fecha-fin').value,
          lugar: document.getElementById('torneo-lugar').value,
          costo: Number(document.getElementById('torneo-costo').value) || 0,
          observacion: document.getElementById('torneo-observacion').value
        };
        try {
          if (id) {
            await apiFetch('/torneos', { method: 'PUT', body: { ...payload, id: Number(id) } });
          } else {
            await apiFetch('/torneos', { method: 'POST', body: payload });
          }
          document.getElementById('modal-torneo').classList.add('hidden');
          document.getElementById('modal-torneo').classList.remove('flex');
          cargarTorneos();
        } catch (e) { alert('Error: ' + e.message); }
      });

      document.querySelector('#modal-torneo > .fixed.inset-0.bg-slate-900\\/50')?.addEventListener('click', () => {
        document.getElementById('modal-torneo').classList.add('hidden');
        document.getElementById('modal-torneo').classList.remove('flex');
      });
    }
  </script>
</body>
</html>
