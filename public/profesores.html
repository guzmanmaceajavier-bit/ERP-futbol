<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><title>Escuela - Profesores | EFUSA V7</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{600:'#16a34a'}}}}}</script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#F1F5F9}</style>
</head><body class="min-h-screen">
<div id="nav-container"></div>
<div class="bg-[#0F172A] text-white">
  <div class="max-w-7xl mx-auto px-4 md:px-6 py-6">
    <div class="flex items-center gap-3">
      <a href="/index.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i class="ph ph-arrow-left"></i></a>
      <div>
        <h1 class="text-2xl font-black">Profesores</h1>
        <p class="text-white/60 text-sm">Cuerpo tecnico</p>
      </div>
      <button onclick="abrirModal()" class="ml-auto px-5 py-3 bg-emerald-500 hover:bg-emerald-400 text-white rounded-xl font-black text-sm shadow-lg flex items-center gap-2">
        <i class="ph ph-plus text-lg"></i> Nuevo profesor
      </button>
      <button onclick="window.close()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ph ph-x"></i></button>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-6">
      <div class="bg-white text-slate-900 rounded-2xl p-4"><p class="text-[10px] font-black text-slate-400 uppercase">Total</p><p id="kpi-total" class="text-xl font-black">0</p></div>
      <div class="bg-white rounded-2xl p-4"><p class="text-[10px] font-black text-slate-400 uppercase">Activos</p><p id="kpi-activos" class="text-xl font-black text-emerald-600">0</p></div>
      <div class="bg-white rounded-2xl p-4"><p class="text-[10px] font-black text-slate-400 uppercase">Nomina mes</p><p id="kpi-nomina" class="text-xl font-black text-slate-900">$0</p></div>
    </div>
  </div>
</div>
<div class="max-w-7xl mx-auto px-4 md:px-6 py-6 space-y-4">
  <div class="bg-white rounded-2xl border p-3 flex flex-col md:flex-row gap-3">
    <div class="relative flex-1"><i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-slate-400"></i><input id="buscador" placeholder="Buscar profesor..." class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border rounded-xl text-sm"></div>
    <select id="f-categoria" class="px-3 py-2.5 bg-white border rounded-xl text-sm font-bold"><option value="">Todas Categorias</option><option>Sub 17-18</option><option>Sub 16-15</option><option>Sub 14-13</option><option>Sub 12-11</option><option>Sub 10-9</option><option>Sub 8-7</option></select>
  </div>
  <div class="bg-white rounded-2xl border overflow-hidden">
    <div class="overflow-auto">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 text-[11px] font-black uppercase text-slate-500"><tr><th class="px-4 py-3">Profesor</th><th class="px-4 py-3">Categoria encargada</th><th class="px-4 py-3">Contacto</th><th class="px-4 py-3 text-right">Salario</th><th class="px-4 py-3 text-center">Acciones</th></tr></thead>
        <tbody id="tabla-profes" class="divide-y"></tbody>
      </table>
    </div>
    <div class="px-4 py-3 bg-slate-50 border-t flex justify-between items-center">
      <span id="info-paginacion" class="text-xs font-bold text-slate-500">0 registros</span>
      <div class="flex gap-2">
        <button id="btn-prev" onclick="cambiarPagina(-1)" class="px-4 py-2 bg-white border rounded-xl text-sm font-bold disabled:opacity-40">Anterior</button>
        <button id="btn-next" onclick="cambiarPagina(1)" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-bold disabled:opacity-40">Siguiente</button>
      </div>
    </div>
  </div>
</div>
<div id="modal-profe" class="fixed inset-0 z-40 hidden items-center justify-center p-4">
  <div class="absolute inset-0 bg-slate-900/60" onclick="cerrarModal()"></div>
  <div class="relative bg-white rounded-2xl p-6 w-full max-w-2xl space-y-4 shadow-2xl">
    <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center -m-6 mb-0 rounded-t-2xl">
      <h3 class="font-bold flex items-center gap-2"><span class="w-8 h-8 rounded-lg bg-white text-slate-900 flex items-center justify-center"><i class="ph ph-chalkboard-teacher"></i></span> <span id="modal-title">Profesor</span></h3>
      <div class="flex items-center gap-2">
        <button type="button" onclick="cerrarModal()" class="hidden md:flex items-center gap-1 px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-full text-xs font-bold"><i class="ph ph-arrow-left"></i> Volver</button>
        <button onclick="cerrarModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center" title="Cerrar (Esc)"><i class="ph ph-x text-lg"></i></button>
      </div>
    </div>
    <form id="formProfe" class="space-y-3">
      <input type="hidden" id="profe-id">
      <input id="profe-nombre" placeholder="Nombre completo *" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl">
      <div class="grid grid-cols-2 gap-3">
        <input id="profe-telefono" placeholder="Telefono" class="w-full px-4 py-3 bg-slate-50 border rounded-xl">
        <input id="profe-documento" placeholder="Documento" class="w-full px-4 py-3 bg-slate-50 border rounded-xl">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <select id="profe-categoria" class="w-full px-4 py-3 bg-slate-50 border rounded-xl">
          <option value="">Categoria encargada</option><option>Sub 17-18</option><option>Sub 16-15</option><option>Sub 14-13</option><option>Sub 12-11</option><option>Sub 10-9</option><option>Sub 8-7</option>
        </select>
        <input id="profe-especialidad" placeholder="Especialidad" class="w-full px-4 py-3 bg-slate-50 border rounded-xl">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <input id="profe-salario" type="number" placeholder="Salario mensual" class="w-full px-4 py-3 bg-slate-50 border rounded-xl">
        <select id="profe-estado" class="w-full px-4 py-3 bg-slate-50 border rounded-xl"><option value="true">Activo</option><option value="false">Inactivo</option></select>
      </div>
      <button type="submit" class="w-full py-3 bg-slate-900 text-white rounded-xl font-black">Guardar profesor</button>
    </form>
  </div>
</div>
<script type="module">
import { verificarSesion } from '/recursos/js/auth.js';
import { injectNav } from '/recursos/js/nav.js';
import { apiFetch } from '/recursos/js/configuracion.js';
const u=await verificarSesion(); if(u) injectNav('profesores');
let lista=[], pagina=1, porPagina=6;
async function cargar(){ lista=await apiFetch('/profesores'); render(); }
function getFiltrados(){
  const q=(document.getElementById('buscador').value||'').toLowerCase();
  const cat=document.getElementById('f-categoria').value;
  return lista.filter(p=>{
    if(q && !`${p.nombre} ${p.telefono||''} ${p.especialidad||''}`.toLowerCase().includes(q)) return false;
    if(cat && p.especialidad!==cat) return false;
    return true;
  });
}
function render(){
  const filtrados=getFiltrados();
  document.getElementById('kpi-total').textContent=lista.length;
  document.getElementById('kpi-activos').textContent=lista.filter(p=>p.activo!==false).length;
  document.getElementById('kpi-nomina').textContent='$'+lista.reduce((a,b)=>a+Number(b.salario||0),0).toLocaleString();
  const totalPages=Math.ceil(filtrados.length/porPagina)||1;
  if(pagina>totalPages) pagina=totalPages;
  const page=filtrados.slice((pagina-1)*porPagina, pagina*porPagina);
  const tb=document.getElementById('tabla-profes'); tb.innerHTML='';
  if(!page.length) tb.innerHTML='<tr><td colspan="5" class="text-center py-8 text-slate-400">Sin profesores</td></tr>';
  page.forEach(p=>{
    const tr=document.createElement('tr');
    tr.className='hover:bg-slate-50';
    tr.innerHTML=`<td class="px-4 py-3"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center font-black text-xs">${p.nombre.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div><div><p class="font-bold">${p.nombre}</p><p class="text-xs text-slate-500">${p.documento||'Sin doc'}</p></div></div></td>
      <td class="px-4 py-3"><span class="bg-slate-100 px-2 py-1 rounded-full text-xs font-bold">${p.especialidad||'Sin especialidad'}</span></td>
      <td class="px-4 py-3 text-sm">${p.Telefono||'-'}</td>
      <td class="px-4 py-3 text-right font-black">$${Number(p.salario).toLocaleString()}</td>
      <td class="px-4 py-3"><div class="flex justify-center gap-1">
        <button onclick="pagarNomina(${p.id})" class="px-2 py-1 bg-amber-500 text-white rounded-lg text-xs font-bold">Nomina</button>
        <button onclick="editar(${p.id})" class="w-7 h-7 rounded-lg bg-white border flex items-center justify-center"><i class="ph ph-pencil-simple"></i></button>
        <button onclick="eliminar(${p.id})" class="w-7 h-7 rounded-lg bg-white border text-rose-600 flex items-center justify-center"><i class="ph ph-trash"></i></button>
      </div></td>`;
    tb.appendChild(tr);
  });
  document.getElementById('info-paginacion').textContent=`Mostrando ${filtrados.length} de ${lista.length} registros`;
  document.getElementById('btn-prev').disabled=pagina===1;
  document.getElementById('btn-next').disabled=pagina===totalPages;
}
window.cambiarPagina=(d)=>{ pagina+=d; render(); }
window.abrirModal=()=>{document.getElementById('modal-profe').classList.remove('hidden'); document.getElementById('modal-profe').classList.add('flex');}
window.cerrarModal=()=>{document.getElementById('modal-profe').classList.add('hidden');}
  window.editar=(id)=>{const p=lista.find(x=>x.id===id); document.getElementById('profe-id').value=p.id; document.getElementById('profe-nombre').value=p.nombre; document.getElementById('profe-telefono').value=p.telefono||''; document.getElementById('profe-documento').value=p.documento||''; document.getElementById('profe-categoria').value=p.categoria||p.especialidad||''; document.getElementById('profe-especialidad').value=p.especialidad||''; document.getElementById('profe-salario').value=p.salario; document.getElementById('profe-estado').value=String(p.activo!==false); abrirModal();}
window.eliminar=async(id)=>{ if(!confirm('Estas seguro de eliminar este profesor?'))return; await apiFetch('/profesores?id='+id,{method:'DELETE'}); cargar();}
window.pagarNomina=async(id)=>{ const m=prompt('Monto nomina:'); if(!m) return; await apiFetch('/profesores',{method:'PATCH', body:{profesor_id:id, monto:Number(m)}}); alert('Nomina pagada y gasto creado'); }
document.getElementById('formProfe').addEventListener('submit', async e=>{
  e.preventDefault();
  const id=document.getElementById('profe-id').value;
  const payload={ nombre: document.getElementById('profe-nombre').value, telefono: document.getElementById('profe-telefono').value, documento: document.getElementById('profe-documento').value, especialidad: document.getElementById('profe-especialidad').value, salario: Number(document.getElementById('profe-salario').value)||0, activo: document.getElementById('profe-estado').value==='true' };
  if(id){ payload.id=Number(id); await apiFetch('/profesores',{method:'PUT', body:payload}); } else await apiFetch('/profesores',{method:'POST', body:payload});
  cerrarModal(); e.target.reset(); cargar();
});
document.getElementById('buscador').addEventListener('input', ()=>{ pagina=1; render(); });
document.getElementById('f-categoria').addEventListener('change', ()=>{ pagina=1; render(); });
cargar();
</script></body></html>
