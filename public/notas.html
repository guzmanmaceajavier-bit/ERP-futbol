<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Notas | EFUSA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #F8FAFC; }
  </style>
</head>
<body class="min-h-screen text-slate-800 antialiased">
  <div id="nav-container"></div>
  <div class="bg-[#0F172A] text-white">
    <div class="max-w-7xl mx-auto px-4 md:px-6 py-6">
      <div class="flex items-center gap-3">
        <a href="/index.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i class="ph ph-arrow-left"></i></a>
        <div>
          <h1 class="text-2xl font-black">Notas por Jugador</h1>
          <p class="text-white/60 text-sm">Observaciones internas para cada jugador</p>
        </div>
        <button onclick="window.close()" class="ml-auto w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ph ph-x"></i></button>
      </div>
    </div>
  </div>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="md:col-span-1 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <h2 class="font-bold text-slate-900 mb-4">Seleccionar Jugador</h2>
        <select id="select-jugador-notas" class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
          <option value="">Cargando jugadores...</option>
        </select>
        <div id="jugador-info" class="mt-4 p-4 bg-slate-50 rounded-xl hidden">
          <p class="text-xs font-bold text-slate-400 uppercase">Categoria</p>
          <p id="jugador-categoria-notas" class="font-bold text-slate-900"></p>
          <p class="text-xs font-bold text-slate-400 uppercase mt-2">Telefono</p>
          <p id="jugador-telefono-notas" class="text-slate-600"></p>
        </div>
      </div>
      <div class="md:col-span-2">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-4">
          <h2 class="font-bold text-slate-900 mb-4">Agregar Nota</h2>
          <textarea id="nota-texto" rows="3" class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Escribe una nota sobre este jugador..."></textarea>
          <button onclick="guardarNota()" class="mt-3 px-5 py-2.5 bg-purple-600 text-white font-bold rounded-xl hover:bg-purple-700 transition-all flex items-center gap-2">
            <i class="ph ph-floppy-disk"></i> Guardar Nota
          </button>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
          <h2 class="font-bold text-slate-900 mb-4">Historial de Notas</h2>
          <div id="lista-notas" class="space-y-3">
            <p class="text-sm text-slate-400 text-center py-8">Selecciona un jugador para ver sus notas.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { verificarSesion } from '/recursos/js/auth.js';
    import { injectNav } from '/recursos/js/nav.js';
    import { apiFetch } from '/recursos/js/configuracion.js';
    const usuario = await verificarSesion();
    if (usuario) {
      injectNav('notas');
      const select = document.getElementById('select-jugador-notas');
      const lista = document.getElementById('lista-notas');
      let jugadores = [];

      async function cargarJugadores() {
        try {
          jugadores = await apiFetch('/jugadores');
          select.innerHTML = '<option value="">Seleccione un jugador...</option>' + 
            jugadores.map(j => `<option value="${j.id}">${j.nombre} ${j.apellidos || ''} (${j.categoria||''})</option>`).join('');
        } catch(e) { console.error(e); }
      }
      cargarJugadores();

      select.addEventListener('change', async () => {
        const id = select.value;
        const info = document.getElementById('jugador-info');
        if (!id) { info.classList.add('hidden'); lista.innerHTML = '<p class="text-sm text-slate-400 text-center py-8">Selecciona un jugador.</p>'; return; }
        const j = jugadores.find(jj => jj.id === Number(id));
        if (j) {
          document.getElementById('jugador-categoria-notas').textContent = j.categoria || '-';
          document.getElementById('jugador-telefono-notas').textContent = j.telefono || '-';
          info.classList.remove('hidden');
        }
        try {
          const notas = await apiFetch(`/notas?jugador_id=${id}`);
          lista.innerHTML = '';
          if (notas.length === 0) {
            lista.innerHTML = '<p class="text-sm text-slate-400 text-center py-8">No hay notas para este jugador.</p>';
            return;
          }
          notas.forEach(n => {
            lista.innerHTML += `
              <div class="p-4 rounded-xl border border-slate-100 bg-slate-50/50">
                <div class="flex justify-between items-start">
                  <p class="text-sm text-slate-700 whitespace-pre-wrap">${n.nota}</p>
                  <button onclick="eliminarNota(${n.id})" class="text-rose-400 hover:text-rose-600 p-1"><i class="ph ph-trash"></i></button>
                </div>
                <p class="text-xs text-slate-400 mt-2">${new Date(n.created_at).toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' })}</p>
              </div>
            `;
          });
        } catch(e) { console.error(e); }
      });

      window.guardarNota = async function() {
        const jugador_id = select.value;
        const nota = document.getElementById('nota-texto').value.trim();
        if (!jugador_id || !nota) return alert('Selecciona un jugador y escribe una nota.');
        try {
          await apiFetch('/notas', { method: 'POST', body: { jugador_id: Number(jugador_id), nota } });
          document.getElementById('nota-texto').value = '';
          select.dispatchEvent(new Event('change'));
        } catch(e) { alert('Error: ' + e.message); }
      };

      window.eliminarNota = async function(id) {
        if (!confirm('Estas seguro de eliminar esta nota?')) return;
        try {
          await apiFetch(`/notas?id=${id}`, { method: 'DELETE' });
          select.dispatchEvent(new Event('change'));
        } catch(e) { alert('Error: ' + e.message); }
      };
    }
  </script>
</body>
</html>
