<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><title>Cancha - Asistencia | EFUSA V7</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{600:'#16a34a'}}}}}</script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<style>body{font-family:Inter,sans-serif;background:#F1F5F9}</style>
</head><body class="min-h-screen">
<div id="nav-container"></div>
<div class="bg-[#0F172A] text-white">
  <div class="max-w-7xl mx-auto px-4 md:px-6 py-6">
    <div class="flex items-center gap-3">
      <a href="/index.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i class="ph ph-arrow-left"></i></a>
      <div>
        <h1 class="text-2xl font-black">Asistencia</h1>
        <p class="text-white/60 text-sm">Registra la asistencia diaria</p>
      </div>
      <div class="ml-auto flex gap-2">
        <button onclick="descargarExcel()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-black">Excel</button>
        <button onclick="descargarPDF()" class="px-3 py-2 bg-white text-slate-900 rounded-xl text-xs font-black">PDF</button>
      </div>
      <button onclick="window.close()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ph ph-x"></i></button>
    </div>
  </div>
</div>
<div class="max-w-7xl mx-auto px-4 md:px-6 py-6 space-y-4">
  <div class="bg-white rounded-2xl border p-4 flex flex-col md:flex-row gap-3">
    <input id="asistencia-fecha" type="date" class="px-4 py-2.5 bg-slate-50 border rounded-xl text-sm">
    <select id="asistencia-categoria" class="px-4 py-2.5 bg-slate-50 border rounded-xl text-sm font-bold"></select>
    <button onclick="cargarJugadoresAsistencia()" class="px-5 py-2.5 bg-slate-900 text-white rounded-xl text-sm font-black">Cargar lista</button>
    <span class="ml-auto text-xs text-slate-500 flex items-center" id="info-asistencia"></span>
  </div>
  <div class="bg-white rounded-2xl border overflow-hidden">
    <div class="px-5 py-3 bg-slate-50 border-b flex justify-between items-center">
      <h3 class="font-black text-sm">Lista</h3>
      <span class="text-xs bg-white border px-2 py-1 rounded-full font-bold" id="total-asist">0 jugadores</span>
    </div>
    <div id="lista-asistencia" class="divide-y max-h-[520px] overflow-auto"></div>
    <div class="p-4 bg-slate-50 border-t flex justify-between items-center">
      <span id="info-paginacion" class="text-xs font-bold text-slate-500">0 registros</span>
      <div class="flex gap-2">
        <button id="btn-prev" onclick="cambiarPagina(-1)" class="px-4 py-2 bg-white border rounded-xl text-sm font-bold disabled:opacity-40">Anterior</button>
        <button id="btn-next" onclick="cambiarPagina(1)" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-bold disabled:opacity-40">Siguiente</button>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { verificarSesion } from '/recursos/js/auth.js';
import { injectNav } from '/recursos/js/nav.js';
import { apiFetch, CATEGORIAS } from '/recursos/js/configuracion.js';
const u=await verificarSesion(); if(u) injectNav('asistencias');
document.getElementById('asistencia-fecha').valueAsDate=new Date();
document.getElementById('asistencia-categoria').innerHTML=CATEGORIAS.map(c=>`<option>${c}</option>`).join('');
let lista=[], pagina=1, porPagina=8;
window.cargarJugadoresAsistencia=async function(){
  const fecha=document.getElementById('asistencia-fecha').value;
  const cat=document.getElementById('asistencia-categoria').value;
  if(!fecha||!cat) return alert('Fecha y categoria');
  const jugadores=await apiFetch('/jugadores');
  const asistencias=await apiFetch('/asistencias?fecha='+fecha);
  lista=jugadores.filter(j=>j.categoria===cat && j.activo!==false).map(j=>{
    const reg=asistencias.find(a=> Number(a.jugador_id)===j.id);
    return {...j, estado: reg? (reg.presente===false? 'Ausente' : reg.estado||'Presente') : 'Presente' };
  });
  pagina=1; render();
}
function render(){
  const cont=document.getElementById('lista-asistencia'); cont.innerHTML='';
  const totalPages=Math.ceil(lista.length/porPagina)||1;
  if(pagina>totalPages) pagina=totalPages;
  const page=lista.slice((pagina-1)*porPagina, pagina*porPagina);
  document.getElementById('total-asist').textContent=lista.length+' jugadores';
  document.getElementById('info-paginacion').textContent=`Mostrando ${page.length} de ${lista.length} registros`;
document.getElementById('btn-prev').disabled=pagina<=1;
document.getElementById('btn-next').disabled=pagina>=totalPages;
  document.getElementById('btn-guardar-asistencia').classList.toggle('hidden', !lista.length);
  if(!page.length){ cont.innerHTML='<p class="p-8 text-center text-slate-400">Sin jugadores en esta categoria</p>'; return; }
  page.forEach(j=>{
    const div=document.createElement('div');
    div.className='flex flex-col md:flex-row md:items-center justify-between p-4 gap-3 hover:bg-slate-50';
    div.innerHTML=`
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center font-black text-xs">${(j.nombre[0]||'')+(j.apellidos?.[0]||'')}</div>
        <div><p class="font-bold text-sm">${j.nombre} ${j.apellidos||''}</p><p class="text-xs text-slate-500">${j.telefono||''}</p></div>
      </div>
      <select data-id="${j.id}" class="estado-select px-3 py-2 bg-white border rounded-xl text-sm font-bold">
        <option value="Presente" ${j.estado==='Presente'?'selected':''}>Presente</option>
        <option value="Ausente" ${j.estado==='Ausente'?'selected':''}>No vino</option>
        <option value="Tarde" ${j.estado==='Tarde'?'selected':''}>Tarde</option>
        <option value="Justificado" ${j.estado==='Justificado'?'selected':''}>Justificado</option>
      </select>
    `;
    cont.appendChild(div);
  });
  cont.querySelectorAll('.estado-select').forEach(s=>{
    s.addEventListener('change', e=>{
      const id=Number(e.target.dataset.id);
      const it=lista.find(x=>x.id===id);
      if(it) it.estado=e.target.value;
    });
  });
}
window.cambiarPagina=(d)=>{ pagina+=d; render(); }
window.guardarAsistencia=async function(){
  const fecha=document.getElementById('asistencia-fecha').value;
  const registros=lista.map(j=> ({ jugador_id:j.id, fecha, presente: j.estado==='Presente', estado: j.estado }));
  await apiFetch('/asistencias',{method:'POST', body:{ registros }});
  alert('Asistencia guardada');
}
window.descargarExcel=()=>{
  if(!lista.length) return alert('Carga lista primero');
  const rows=lista.map(j=> ({ Jugador: j.nombre+' '+(j.apellidos||''), Categoria: j.categoria, Telefono: j.telefono, Estado: j.estado, Fecha: document.getElementById('asistencia-fecha').value }));
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Asistencia');
  XLSX.writeFile(wb, 'Asistencia_'+document.getElementById('asistencia-fecha').value+'.xlsx');
}
window.descargarPDF=()=>{
  if(!lista.length) return alert('Carga lista primero');
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  doc.text('Asistencia - '+document.getElementById('asistencia-fecha').value, 14, 14);
  doc.autoTable({ head:[['Jugador','Categoria','Estado']], body: lista.map(j=> [j.nombre+' '+(j.apellidos||''), j.categoria, j.estado]), startY:18, headStyles:{fillColor:[15,23,42]} });
  doc.save('Asistencia_'+document.getElementById('asistencia-fecha').value+'.pdf');
}
</script></body></html>
