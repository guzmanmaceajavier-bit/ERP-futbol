<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><title>Reportes | EFUSA V7</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{600:'#16a34a'}}}}}</script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>body{font-family:Inter,sans-serif;background:#F1F5F9}</style>
</head><body class="min-h-screen">
<div id="nav-container"></div>
<div class="bg-[#0F172A] text-white">
  <div class="max-w-7xl mx-auto px-4 md:px-6 py-6">
    <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6"><div class="flex items-center gap-3">
      <a href="/index.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i class="ph ph-arrow-left"></i></a>
      <div>
        
        <h1 class="text-2xl font-black">Reportes</h1>
        <p class="text-white/60 text-sm">Filtra y descarga listados</p>
      </div></div>
      <button onclick="window.close()" class="ml-auto w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ph ph-x"></i></button>
    </div>
  </div>
</div>
<div class="max-w-7xl mx-auto p-4 md:px-6 py-6 space-y-4">
  <div class="bg-white rounded-2xl border p-4">
    <div class="grid md:grid-cols-4 gap-3">
      <div>
        <label class="text-xs font-bold text-slate-500 uppercase">Categoria</label>
        <select id="f-Categoria" class="mt-1 w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm"><option value="">Todas</option></select>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-500 uppercase">Desde</label>
        <input id="f-desde" type="date" class="mt-1 w-full px-3 py-2.5 bg-slate-50 border rounded-xl">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-500 uppercase">Hasta</label>
        <input id="f-hasta" type="date" class="mt-1 w-full px-3 py-2.5 bg-slate-50 border rounded-xl">
      </div>
      <div class="flex items-end gap-2">
        <button onclick="cargar()" class="flex-1 py-2.5 bg-slate-900 text-white rounded-xl text-sm font-black">Generar</button>
        <button onclick="exportExcel()" class="px-4 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-black">Excel</button>
        <button onclick="exportPDF()" class="px-4 py-2.5 bg-white border rounded-xl text-sm font-black">PDF</button>
      </div>
    </div>
    <div class="mt-3 relative">
      <button id="btn-cols" onclick="document.getElementById('panel-cols').classList.toggle('hidden')" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-bold flex items-center gap-2">
        <i class="ph ph-columns"></i> Columnas: <span id="cols-count">7</span> <i class="ph ph-caret-down"></i>
      </button>
      <div id="panel-cols" class="hidden absolute top-full left-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl p-4 w-64 z-20">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-black uppercase text-slate-500">Elegir columnas</span>
          <button onclick="toggleCols(true)" class="text-xs text-emerald-600 font-bold">Todas</button>
        </div>
        <div class="space-y-2">
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked data-col="nombre" class="rounded"> Nombre</label>
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked data-col="Categoria" class="rounded"> Categoria</label>
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked data-col="profesor" class="rounded"> Profesor</label>
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked data-col="Telefono" class="rounded"> Telefono</label>
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked data-col="genero" class="rounded"> Genero</label>
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked data-col="estado" class="rounded"> Estado</label>
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked data-col="mensualidad" class="rounded"> Pagado</label>
        </div>
        <button onclick="document.getElementById('panel-cols').classList.add('hidden')" class="w-full mt-3 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">Listo</button>
      </div>
    </div>
  </div>
  <div class="bg-white rounded-2xl border overflow-hidden">
    <div class="px-5 py-3 bg-slate-50 border-b flex justify-between items-center">
      <h3 class="font-black text-sm">Vista previa (<span id="total-rows">0</span>)</h3>
      <span class="text-xs text-slate-500">Incluye profesor encargado por Categoria</span>
    </div>
    <div class="overflow-auto max-h-[460px]">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 sticky top-0 text-[11px] font-black uppercase text-slate-500"><tr id="thead"></tr></thead>
        <tbody id="tbody" class="divide-y"></tbody>
      </table>
    </div>
    <div class="px-4 py-3 bg-slate-50 border-t flex justify-between items-center">
      <span id="info-paginacion" class="text-xs font-bold text-slate-500">0 registros</span>
      <div class="flex gap-2"><button id="btn-prev" onclick="cambiarPagina(-1)" class="px-4 py-2 bg-white border rounded-xl text-sm font-bold disabled:opacity-40">Anterior</button><button id="btn-next" onclick="cambiarPagina(1)" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-bold disabled:opacity-40">Siguiente</button></div>
    </div>
  </div>
</div>
<script type="module">
import { verificarSesion } from '/recursos/js/auth.js';
import { injectNav } from '/recursos/js/nav.js';
import { apiFetch } from '/recursos/js/configuracion.js';
const u=await verificarSesion(); if(u) injectNav('reportes');
let datos=[], profesores=[], pagina=1, porPagina=10;
async function cargar(){
  const cat=document.getElementById('f-Categoria').value;
  const desde=document.getElementById('f-desde').value;
  const hasta=document.getElementById('f-hasta').value;
  datos=await apiFetch('/jugadores');
  profesores=await apiFetch('/profesores').catch(()=>[]);
  if(cat) datos=datos.filter(j=>j.Categoria===cat);
  if(desde) datos=datos.filter(j=> (j.created_at||'').slice(0,10)>=desde);
  if(hasta) datos=datos.filter(j=> (j.created_at||'').slice(0,10)<=hasta);
  // llenar select Categorias
  const sel=document.getElementById('f-Categoria');
  if(sel.options.length<=1){
    const cats=[...new Set(datos.map(d=>d.Categoria))];
    cats.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
  }
  pagina=1; render();
}
function getProfesor(cat){
  const p=profesores.find(x=> (x.Categoria||x.especialidad)===cat);
  return p? p.nombre : 'Sin asignar';
}
function getCols(){ return [...document.querySelectorAll('[data-col]:checked')].map(c=>c.dataset.col); }
function updateColsCount(){ const n=getCols().length; const el=document.getElementById('cols-count'); if(el) el.textContent=n; }
window.toggleCols=(all)=>{ document.querySelectorAll('[data-col]').forEach(c=> c.checked=all); updateColsCount(); render(); }
function render(){
  const cols=getCols();
  const thead=document.getElementById('thead');
  const tbody=document.getElementById('tbody');
  thead.innerHTML=cols.map(c=> `<th class="px-4 py-2">${c}</th>`).join('');
  const totalPages=Math.ceil(datos.length/porPagina)||1;
  if(pagina>totalPages) pagina=totalPages;
  const page=datos.slice((pagina-1)*porPagina, pagina*porPagina);
  tbody.innerHTML='';
  document.getElementById('total-rows').textContent=datos.length+' registros';
  document.getElementById('info-paginacion').textContent=`Mostrando ${page.length} de ${datos.length} registros`;
  page.forEach(j=>{
    const base=Number(j.mensualidad_objetivo)||50000; const desc=Number(j.descuento_beca)||0; const obj=Math.round(base*(1-desc/100));
    const estado=obj===0?'Becado': Number(j.mensualidad)>=obj?'Al dia': Number(j.mensualidad)>0?'Abono':'Debe';
    const row={ nombre: j.nombre+' '+(j.apellidos||''), Categoria: j.Categoria, profesor: getProfesor(j.Categoria), Telefono: j.acudiente_Telefono||j.Telefono, genero: j.genero||'Nino', estado, mensualidad: '$'+Number(j.mensualidad||0).toLocaleString() };
    const tr=document.createElement('tr');
    tr.className='hover:bg-slate-50';
    tr.innerHTML=cols.map(c=> `<td class="px-4 py-2">${row[c]||'-'}</td>`).join('');
    tbody.appendChild(tr);
  });
}
window.cargar=cargar;
window.cambiarPagina=(d)=>{ pagina+=d; render(); }
window.exportExcel=()=>{
  const cols=getCols();
  const rows=datos.map(j=>{
    const base=Number(j.mensualidad_objetivo)||50000; const desc=Number(j.descuento_beca)||0; const obj=Math.round(base*(1-desc/100));
    const estado=obj===0?'Becado': Number(j.mensualidad)>=obj?'Al dia': Number(j.mensualidad)>0?'Abono':'Debe';
    const o={}; cols.forEach(c=>{
      if(c==='nombre') o[c]=j.nombre+' '+(j.apellidos||'');
      else if(c==='Categoria') o[c]=j.Categoria;
      else if(c==='profesor') o[c]=getProfesor(j.Categoria);
      else if(c==='Telefono') o[c]=j.acudiente_Telefono||j.Telefono;
      else if(c==='genero') o[c]=j.genero;
      else if(c==='estado') o[c]=estado;
      else if(c==='mensualidad') o[c]=Number(j.mensualidad);
    }); return o;
  });
  const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Reporte'); XLSX.writeFile(wb, 'Reporte_EFUSA_'+new Date().toISOString().slice(0,10)+'.xlsx');
};
window.exportPDF=()=>{
  const {jsPDF}=window.jspdf; const doc=new jsPDF(); doc.text('Reporte EFUSA - '+new Date().toLocaleDateString(),14,14);
  const cols=getCols(); const head=[cols];
  const body=datos.map(j=>{
    const base=Number(j.mensualidad_objetivo)||50000; const desc=Number(j.descuento_beca)||0; const obj=Math.round(base*(1-desc/100));
    const estado=obj===0?'Becado': Number(j.mensualidad)>=obj?'Al dia': Number(j.mensualidad)>0?'Abono':'Debe';
    return cols.map(c=>{
      if(c==='nombre') return j.nombre+' '+(j.apellidos||'');
      if(c==='Categoria') return j.Categoria;
      if(c==='profesor') return getProfesor(j.Categoria);
      if(c==='Telefono') return j.acudiente_Telefono||j.Telefono;
      if(c==='genero') return j.genero;
      if(c==='estado') return estado;
      if(c==='mensualidad') return '$'+Number(j.mensualidad).toLocaleString();
      return '-';
    });
  });
  doc.autoTable({ head, body, startY:18, headStyles:{fillColor:[15,23,42]}, styles:{fontSize:8}}); doc.save('Reporte_'+new Date().toISOString().slice(0,10)+'.pdf');
};
cargar();
document.querySelectorAll('[data-col]').forEach(c=> c.addEventListener('change', ()=>{ updateColsCount(); render(); }));
updateColsCount();
document.addEventListener('click', (e)=>{
  const panel=document.getElementById('panel-cols');
  const btn=document.getElementById('btn-cols');
  if(panel && !panel.contains(e.target) && !btn.contains(e.target)) panel.classList.add('hidden');
});
</script></body></html>
