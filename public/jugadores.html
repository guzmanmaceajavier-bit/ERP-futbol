<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escuela - Jugadores | EFUSA V7</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>*</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{brand:{50:'#ecfdf5',500:'#22c55e',600:'#16a34a',700:'#15803d'}},boxShadow:{card:'0 8px 30px rgba(0,0,0,0.06)'}}}}</script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,sans-serif;background:#F1F5F9}</style>
</head>
<body class="min-h-screen text-slate-800">
<div id="nav-container"></div>
<div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-3 pointer-events-none"></div>
<div class="bg-[#0F172A] text-white">
  <div class="max-w-7xl mx-auto px-4 md:px-6 py-6">
    <div class="flex items-center gap-3">
      <a href="/index.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i class="ph ph-arrow-left"></i></a>
      <div>
        <h1 class="text-2xl font-black">Jugadores</h1>
        <p class="text-white/60 text-sm">Administra y da seguimiento a todos tus jugadores.</p>
      </div>
      <button onclick="abrirModal()" class="ml-auto px-5 py-3 bg-emerald-500 hover:bg-emerald-400 text-white rounded-xl font-black text-sm shadow-lg flex items-center gap-2">
        <i class="ph ph-plus text-lg"></i> Nuevo jugador
      </button>
      <button onclick="window.close()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ph ph-x"></i></button>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-6">
      <div class="bg-white text-slate-900 rounded-2xl p-4 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-600 text-white flex items-center justify-center"><i class="ph ph-users-three"></i></div>
        <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">TOTAL</p><p id="stat-total" class="text-xl font-black">0</p></div>
      </div>
      <div class="bg-white rounded-2xl p-4 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center"><i class="ph ph-check"></i></div>
        <div><p class="text-[10px] font-black text-slate-400 uppercase">AL DIA</p><p id="stat-pagados" class="text-xl font-black text-emerald-600">0</p></div>
      </div>
      <div class="bg-white rounded-2xl p-4 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center"><i class="ph ph-clock"></i></div>
        <div><p class="text-[10px] font-black text-slate-400 uppercase">ABONO</p><p id="stat-abono" class="text-xl font-black text-amber-600">0</p></div>
      </div>
      <div class="bg-white rounded-2xl p-4 flex items-center gap-3 border-2 border-rose-100">
        <div class="w-10 h-10 rounded-xl bg-rose-500 text-white flex items-center justify-center"><i class="ph ph-warning"></i></div>
        <div><p class="text-[10px] font-black text-rose-400 uppercase">DEUDORES</p><p id="stat-pendientes" class="text-xl font-black text-rose-600">0</p></div>
      </div>
    </div>
  </div>
</div>
<main class="max-w-7xl mx-auto px-4 md:px-6 py-6 space-y-4">
  <div class="bg-white rounded-2xl border border-slate-200 p-3 md:p-4 flex flex-col lg:flex-row gap-3 lg:items-center justify-between shadow-sm">
    <div class="flex flex-1 gap-2">
      <div class="relative flex-1">
        <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-slate-400"></i>
        <input id="buscador" placeholder="Buscar por nombre, documento o Telefono..." class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white focus:border-slate-900">
      </div>
      <select id="f-genero" class="px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold">
        <option value="">Genero: Todos</option><option value="Masculino">Ninos</option><option value="Femenino">Ninas</option>
      </select>
    </div>
    <div class="flex gap-2 flex-wrap">
      <select id="f-categoria" class="px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold">
        <option value="">Categoria: Todas</option><option>Sub 17-18</option><option>Sub 16-15</option><option>Sub 14-13</option><option>Sub 12-11</option><option>Sub 10-9</option><option>Sub 8-7</option>
      </select>
      <select id="f-estado" class="px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold">
        <option value="">Estado: Todos</option><option value="al_dia">Al dia</option><option value="abono">Abono</option><option value="debe">Debe</option><option value="vencido">Vencido</option><option value="becado">Becado</option>
      </select>
      <div class="flex bg-slate-900 rounded-xl p-1">
        <button id="btn-view-list" class="px-3 py-1.5 bg-white rounded-lg text-xs font-black">Lista</button>
        <button id="btn-view-grid" class="px-3 py-1.5 text-white/70 text-xs font-bold">Tarjetas</button>
      </div>
    </div>
  </div>
  <section class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
    <div class="overflow-auto">
      <table class="w-full text-left">
        <thead class="bg-slate-50 border-b text-[11px] font-black uppercase tracking-widest text-slate-500">
          <tr>
            <th class="px-4 py-3">Jugador</th>
            <th class="px-4 py-3">Genero - Categoria</th>
            <th class="px-4 py-3">Acudiente</th>
            <th class="px-4 py-3 text-center">Estado</th>
            <th class="px-4 py-3 text-right">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-jugadores" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
    <div id="grid-jugadores" class="hidden grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4 bg-slate-50"></div>
    <div class="px-4 py-3 bg-slate-50 border-t flex justify-between items-center">
      <span id="info-paginacion" class="text-xs font-bold text-slate-500">0 registros</span>
      <div class="flex gap-2">
        <button id="btn-prev" onclick="cambiarPagina(-1)" class="px-4 py-2 bg-white border rounded-xl text-sm font-bold disabled:opacity-40">Anterior</button>
        <button id="btn-next" onclick="cambiarPagina(1)" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-bold disabled:opacity-40">Siguiente</button>
      </div>
    </div>
  </section>
</main>
<div id="modal-jugador" class="fixed inset-0 z-40 hidden">
  <div id="modal-backdrop" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
  <div class="absolute inset-0 overflow-y-auto p-4 flex items-start md:items-center justify-center">
    <div id="modal-panel" class="bg-white rounded-2xl w-full max-w-4xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">
      <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center shrink-0">
        <h3 class="font-bold flex items-center gap-2"><span class="w-8 h-8 rounded-lg bg-white text-slate-900 flex items-center justify-center"><i id="modal-icon" class="ph ph-user-plus"></i></span> <span id="modal-title">Nuevo jugador</span></h3>
        <div class="flex items-center gap-2">
          <button type="button" onclick="cerrarModal()" class="hidden md:flex items-center gap-1 px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-full text-xs font-bold"><i class="ph ph-arrow-left"></i> Volver</button>
          <button onclick="cerrarModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center" title="Cerrar (Esc)"><i class="ph ph-x text-lg"></i></button>
        </div>
      </div>
      <form id="formJugador" class="p-6 space-y-5 overflow-y-auto">
        <input type="hidden" id="jugador-id">
        <div class="grid md:grid-cols-3 gap-4 bg-slate-50 border rounded-2xl p-4">
          <div class="text-center">
            <div class="w-24 h-24 mx-auto rounded-2xl bg-white border-2 border-dashed flex items-center justify-center overflow-hidden" id="foto-preview">
              <i class="ph ph-user text-3xl text-slate-300"></i>
            </div>
            <label class="mt-2 block text-xs font-bold text-slate-600 cursor-pointer">Foto <input type="file" id="foto-input" accept="image/*" class="hidden" onchange="previewFoto(this)"></label>
            <input type="hidden" id="foto_url">
          </div>
          <div class="md:col-span-2">
            <p class="text-xs font-black text-slate-500 uppercase">QR Carne</p>
            <div class="mt-2 w-24 h-24 bg-white border rounded-xl flex items-center justify-center overflow-hidden" id="qr-preview">
              <span class="text-[10px] text-slate-400">Se genera al guardar</span>
            </div>
            <p class="text-[11px] text-slate-500 mt-1">Para control de entrada. Se genera con ID + nombre.</p>
            <input type="hidden" id="qr_code">
          </div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <label class="text-sm font-bold">Nombres *<input id="nombre" required placeholder="Juan Carlos" class="mt-1 w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-slate-900 outline-none"></label>
          <label class="text-sm font-bold">Apellidos *<input id="apellidos" required placeholder="Perez" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"></label>
        </div>
        <div class="grid md:grid-cols-3 gap-4">
          <label class="text-sm font-bold">Fecha Nac.<input id="fecha_nacimiento" type="date" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"><span id="edad-display" class="text-xs font-black text-emerald-600 mt-1 hidden"></span></label>
          <label class="text-sm font-bold">Tipo ID<select id="tipo_identificacion" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"><option value="">Seleccione</option><option>Registro Civil</option><option>Tarjeta de Identidad</option><option>Cedula</option><option>Cedula de Extranjeria</option></select></label>
          <label class="text-sm font-bold">Numero ID<input id="numero_identificacion" placeholder="Ej. 123456" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"></label>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <label class="text-sm font-bold">Telefono *<input id="telefono" required placeholder="300..." class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"></label>
          <label class="text-sm font-bold">Edad<input id="edad" readonly placeholder="--" class="mt-1 w-full px-4 py-3 bg-slate-100 border rounded-xl text-center font-black"></label>
        </div>
        <div class="grid md:grid-cols-3 gap-4">
          <label class="text-sm font-bold">Genero<select id="genero" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"><option value="Masculino">Nino</option><option value="Femenino">Nina</option></select></label>
          <label class="text-sm font-bold">Categoria<select id="categoria" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"><option>Sub 17-18</option><option>Sub 16-15</option><option>Sub 14-13</option><option>Sub 12-11</option><option>Sub 10-9</option><option>Sub 8-7</option></select></label>
          <label class="text-sm font-bold">Beca<select id="tipo_beca" class="mt-1 w-full px-4 py-3 bg-slate-50 border rounded-xl"><option>Normal</option><option>Becado 50%</option><option>Becado 100%</option><option>Patrocinado</option></select></label>
        </div>
        <div class="grid md:grid-cols-2 gap-4 bg-emerald-50 border border-emerald-200 rounded-2xl p-4">
          <label class="text-sm font-bold text-emerald-900">Acudiente<input id="acudiente_nombre" placeholder="Sra. Ana" class="mt-1 w-full px-4 py-3 bg-white border rounded-xl"></label>
          <label class="text-sm font-bold text-emerald-900">WhatsApp acudiente<input id="acudiente_telefono" placeholder="300..." class="mt-1 w-full px-4 py-3 bg-white border rounded-xl"></label>
          <label class="text-sm font-bold">Parentesco<select id="acudiente_parentesco" class="mt-1 w-full px-4 py-3 bg-white border rounded-xl"><option>Madre</option><option>Padre</option><option>Abuelo/a</option><option>Otro</option></select></label>
          <label class="flex items-center gap-2 text-xs font-bold mt-6"><input type="checkbox" id="whatsapp_opt_out"> No enviar WhatsApp masivo (STOP)</label>
        </div>
        <div class="hidden">
          <input id="mensualidad"><input id="activo" type="checkbox" checked>
        </div>
        <button type="submit" class="w-full py-3 bg-slate-900 text-white rounded-xl font-black">Guardar jugador</button>
      </form>
    </div>
  </div>
</div>
<script type="module">
  import { verificarSesion } from '/recursos/js/auth.js';
  import { injectNav } from '/recursos/js/nav.js';
  const u=await verificarSesion(); if(u) injectNav('jugadores');
  const q=new URLSearchParams(location.search).get('q');
  if(q) setTimeout(()=>{ const b=document.getElementById('buscador'); if(b){ b.value=q; b.dispatchEvent(new Event('input')); } },300);
  const fn=document.getElementById('fecha_nacimiento');
  const edadOut=document.getElementById('edad');
  const edadDisp=document.getElementById('edad-display');
  function calcEdad(){
    const v=fn.value; if(!v){ if(edadOut) edadOut.value=''; if(edadDisp) edadDisp.classList.add('hidden'); return; }
    const hoy=new Date(); const nac=new Date(v+'T00:00:00');
    let edad=hoy.getFullYear()-nac.getFullYear();
    const m=hoy.getMonth()-nac.getMonth();
    if(m<0 || (m===0 && hoy.getDate()<nac.getDate())) edad--;
    if(edadOut) edadOut.value=edad+' anos';
    if(edadDisp){ edadDisp.textContent=edad+' anos'; edadDisp.classList.remove('hidden'); }
  }
  if(fn){ fn.addEventListener('change', calcEdad); fn.addEventListener('input', calcEdad); }
  window.calcEdadJugador=calcEdad;
  window.previewFoto=(input)=>{
    if(input.files && input.files[0]){
      const reader=new FileReader();
      reader.onload=e=>{
        document.getElementById('foto-preview').innerHTML=`<img src="${e.target.result}" class="w-full h-full object-cover">`;
        document.getElementById('foto_url').value=e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }
  };
  window.generarQR=(texto)=>{
    const cont=document.getElementById('qr-preview');
    if(!cont) return;
    cont.innerHTML='';
    new QRCode(cont, { text: texto, width: 96, height: 96 });
    document.getElementById('qr_code').value=texto;
  };
</script>
<script type="module" src="/recursos/js/jugadores.js?v=14"></script>
</body>
</html>
